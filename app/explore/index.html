<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eeede6"><title>京师智行 · 漫游校园</title><link rel="stylesheet" href="/explore/explore.css"><script type="importmap">{"imports":{"three":"/map/three.module.min.js"}}</script><script type="module" src="/explore/main.js"></script></head>
<body>
<main id="stage" aria-label="校园三维地图"><div id="scene"></div></main>
<header class="masthead"><a class="brand" href="/explore/" aria-label="京师智行探索首页"><span class="brand-symbol">京</span><span>京师智行<small>北京师范大学 · 海淀校园</small></span></a><div class="header-actions"><button id="header-chat">我的对话</button><details id="settings" class="settings"><summary>更多</summary><div class="settings-body"><p class="eyebrow">地图与服务</p><button id="settings-conditions">按条件找一餐</button><button id="settings-history">我的对话记录</button><button id="art-toggle" aria-pressed="true">示意上色</button><p id="art-note" class="meta">示意材质，非真实立面</p><p id="model-status" class="meta">正在连接</p><a href="/">打开经典对话版 ↗</a></div></details></div></header>
<section class="search-dock" aria-label="校园助手与分类">
 <form id="ask-form" class="ask"><span class="ask-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4zM8 9h8M8 12h5"/></svg></span><label class="sr-only" for="ask-input">询问校园助手</label><input id="ask-input" placeholder="想吃什么，想去哪里？" maxlength="2000" autocomplete="off"><button id="ask-send" type="submit" aria-label="发送给校园助手"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M7 6h11v11"/></svg></button><button id="ask-stop" type="button" hidden>停止</button></form>
</section>
<nav id="categories" aria-label="地点分类"></nav>
<section id="intro" class="intro"><p class="eyebrow">校园生活指南 / EXPLORE</p><h1>校园日常，<br>慢慢发现。</h1><p class="intro-copy">找一栋楼，或一杯咖啡。<br>从地图出发，也可以直接问我。</p><div class="intro-actions"><button id="start-food" class="action">探索吃喝 →</button><button id="start-buildings" class="text-button">查看建筑</button></div><div class="intro-ornament" aria-hidden="true"></div><p class="intro-hint">拖动探索 · 点选建筑</p></section>
<div class="side-tools" aria-label="常用操作"><button id="browse" title="地点清单" aria-label="打开地点清单"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M3 6h1M3 12h1M3 18h1"/></svg></button><button id="chat" title="我的对话" aria-label="打开我的对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4zM8 8h8M8 12h5"/></svg></button><button id="conditions" title="条件推荐" aria-label="打开条件推荐"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18M8 3v6M16 9v6M10 15v6"/></svg></button></div>
<aside id="panel" class="panel" data-open="false" inert aria-label="校园信息面板"><div class="panel-head"><div><p id="panel-kicker" class="eyebrow">校园导览</p><h2 id="panel-title">校园地点</h2></div><div class="panel-controls"><button id="panel-size" aria-expanded="false" aria-label="切换面板高度">展开</button><button id="close-panel" aria-label="收起信息面板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div></div><div id="panel-body"></div></aside>
<div id="pin-caption" class="pin-caption" hidden></div>
<footer class="scene-footer"><div class="map-note"><span id="scene-status" role="status">正在准备三维校园…</span><small>校园示意地图 · 非实景</small></div>
 <div class="view-dock" aria-label="地图视图"><button data-view="home" aria-label="校园全景" aria-pressed="true">全景</button><button data-view="snack" aria-pressed="false">食堂片区</button><button data-view="top" aria-pressed="false">俯视</button><span class="divider"></span><button id="roam-toggle" aria-pressed="true">暂停漫游</button></div>
 <div class="footer-right"><span id="compass" class="compass" aria-label="北方指示">N ↑</span><a href="https://deerflow.tech" target="_blank" rel="noopener noreferrer">Created By Deerflow</a></div>
</footer>
<div id="toast" role="status" hidden></div>
</body></html>
