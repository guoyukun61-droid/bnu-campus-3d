<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园信息工作台 · BNU</title>
<style>
:root{--paper:#edece6;--ink:#24332f;--green:#27654e;--line:#c7cec3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Microsoft YaHei UI',sans-serif}header{padding:18px 25px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h1{font:27px 'SimSun',serif;margin:6px 0}.eyebrow{font:11px Consolas,monospace;letter-spacing:.16em}a{color:var(--green)}main{display:grid;grid-template-columns:minmax(420px,1fr) 365px;height:calc(100vh - 97px)}section.map{display:flex;flex-direction:column;min-width:0}iframe{border:0;width:100%;flex:1;min-height:400px}.tools{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,.export{cursor:pointer;background:var(--ink);border:0;color:#fff;padding:9px 14px;font:12px 'Microsoft YaHei UI';text-decoration:none}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}aside{overflow:auto;border-left:1px solid var(--line);padding:20px}label{display:block;font-size:12px;margin:12px 0 5px}input,select,textarea{display:block;background:#fafaf6;border:1px solid var(--line);border-radius:0;padding:9px;width:100%;font:13px 'Microsoft YaHei UI';color:var(--ink)}input:focus,textarea:focus,select:focus{outline:2px solid #6fa38a}textarea{min-height:70px;resize:vertical}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:11px;line-height:1.8;color:#63706a}.notice{border-left:3px solid #b08d42;padding:8px 12px;background:#f5f1df;font-size:12px;line-height:1.8}#message{font-size:12px;min-height:22px;line-height:1.7}#records{max-height:200px;overflow:auto}.record{display:block;width:100%;text-align:left;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);line-height:1.7}.record small{display:block;color:#727b72}.save{width:100%;background:var(--green);margin-top:15px}footer{padding:10px 20px;font-size:11px;border-top:1px solid var(--line)}h2{font:20px 'SimSun';margin-top:23px}@media(max-width:850px){main{display:block;height:auto}section.map{height:60vh}aside{border-left:0}header{gap:10px}header a{font-size:12px}}
</style></head><body>
<header><div><div class="eyebrow">BNU / CAMPUS KNOWLEDGE / LOCAL WORKSPACE</div><h1>让校园模型，容纳真实的信息</h1></div><a href="../white/index.html">返回白模 ↗</a></header>
<main><section class="map"><div class="tools"><button id="southwest">西南生活区</button><button class="secondary" id="pick">在三维图上选点</button><button class="secondary" id="overview">校园总览</button><a class="export" href="/api/places" download="campus-places.json">导出 JSON</a></div><iframe id="campus" title="校园三维选点地图" src="../index.html?edition=white&view=southwest&embed=1&qa=1&v=20260920v3"></iframe><footer>坐标为本地米制：X 向东，Y 向北。信息与模型分离保存，不会修改建筑体量。</footer></section>
<aside><p class="notice">西南食堂、小吃店与店铺均可录入。旧图只作历史线索；未核实营业时间、价格不要填成事实。</p><div id="message" role="status" aria-live="polite">正在连接本地数据服务…</div>
<form id="editor"><input id="recordId" type="hidden"><input id="revision" type="hidden"><label for="name">地点名称 *</label><input id="name" required maxlength="100" placeholder="例如：现场核实后的食堂名称"><div class="pair"><div><label for="category">类型</label><select id="category"><option value="canteen">食堂</option><option value="snack">小吃店 / 摊位</option><option value="shop">商店</option><option value="building">建筑</option><option value="road">道路</option><option value="correction">模型纠错</option><option value="other">其他</option></select></div><div><label for="status">信息状态</label><select id="status"><option value="unverified">待核实</option><option value="verified">已核实</option><option value="historical">历史记录</option><option value="archived">归档（不删除）</option></select></div></div>
<div class="pair"><div><label for="x">X / 东向米 *</label><input id="x" type="number" step="any" min="-452" max="452" required></div><div><label for="y">Y / 北向米 *</label><input id="y" type="number" step="any" min="-601" max="601" required></div></div>
<label for="building_id">关联建筑 OSM ID（可空）</label><input id="building_id" type="number" step="1"><label for="source">资料来源与核实日期 *</label><input id="source" required maxlength="500" placeholder="例如：2026-09-20 现场核实 / 历史校园图"><label for="hours">营业时间（未知请留空）</label><input id="hours" maxlength="300"><label for="price">价格说明（未知请留空）</label><input id="price" maxlength="200"><label for="tags">标签（逗号分隔）</label><input id="tags" placeholder="早餐, 外带, 无障碍待核"><label for="notes">补充说明 / 菜单 / 纠错内容</label><textarea id="notes" maxlength="4000"></textarea><button class="save" id="save" type="submit" disabled>保存到本机数据库</button><button class="secondary" type="button" id="new">新建记录</button></form>
<h2>校园信息索引</h2><label for="filter">搜索已录入信息</label><input id="filter" placeholder="输入店名、说明关键词"><div id="records"></div><p class="hint">此版本仅供本机使用。保存后刷新仍保留；导出 JSON 便于备份或智能体读取。已核实状态由录入者负责，不代表系统自动核验。</p><a class="hint" href="https://deerflow.tech" target="_blank" rel="noopener">Created By Deerflow</a></aside></main>
<script src="app.js"></script></body></html>
